name: Bug report
description: Report a reproducible problem in CodeGroup
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a CodeGroup problem. Please include enough detail to reproduce it reliably.

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.108.0
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: CodeGroup version
      placeholder: e.g. 1.4.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Create ...
        3. Drag ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant Output logs, screenshots, GIFs, or error messages. Remove sensitive data first.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Workspace type, multi-root setup, relevant settings, or anything else that may matter.
